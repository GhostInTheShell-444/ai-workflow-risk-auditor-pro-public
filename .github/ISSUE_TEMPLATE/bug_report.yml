name: Bug report
description: Report reproducible incorrect behavior using synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, real workflow content, or sensitive screenshots. Use synthetic examples only.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, browser, Streamlit version, and whether optional local Ollama was enabled.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal numbered reproduction using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Remove personal data, local paths, identifiers, and model output not created from synthetic text.
  - type: dropdown
    id: synthetic
    attributes:
      label: Is all submitted data synthetic?
      options:
        - "Yes"
        - "No — I will not submit it"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, credentials, personal data, and real workflow content.
          required: true
